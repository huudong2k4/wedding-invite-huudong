<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thiệp cưới Hữu Đông & Quỳnh Như</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to bottom, #fff5f8, #ffe3e3);
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      color: #c0392b;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 30px;
      color: #555;
    }
    .names {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }
    .section {
      margin-bottom: 30px;
    }
    .date, .location {
      font-size: 18px;
    }
    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thiệp Mời</h1>
    <h2>Trân trọng kính mời</h2>

    <div class="section names">
      Nguyễn Hữu Đông <br/>
      &<br/>
      Trần Quỳnh Như
    </div>

    <div class="section date">
      Vào ngày <strong>16/06/2025</strong> <br/>
      (nhằm ngày <strong>21/05 âm lịch</strong>)
    </div>

    <div class="section location">
      Tại: <br/>
      <strong>Ấp Mỹ Quí, xã Hiệp Mỹ Tây, huyện Cầu Ngang, tỉnh Trà Vinh</strong>
    </div>

    <div class="section">
      Rất mong sự hiện diện của Quý vị để buổi lễ thêm phần trang trọng!
    </div>

    <div class="footer">
      Thiệp cưới online bởi Hữu Đông
    </div>
  </div>
</body>
</html>
