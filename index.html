<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thiệp Cưới Hữu Đông & Quỳnh Như</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: #f0f8ff;
      color: #333;
      overflow-x: hidden;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 58px;
      color: #2980b9;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 26px;
      color: #555;
      margin-bottom: 30px;
    }
    .names {
      font-size: 32px;
      font-weight: bold;
      color: #2980b9;
      margin: 20px 0;
    }
    .invite {
      font-size: 24px;
      color: #555;
      margin-bottom: 40px;
    }
    .section {
      margin-bottom: 30px;
    }
    .date, .time-detail, .countdown {
      font-size: 20px;
      color: #555;
      line-height: 1.6;
    }
    .time-detail {
      margin-bottom: 20px;
    }
    .countdown {
      font-size: 24px;
      font-weight: bold;
      color: #e74c3c;
      margin: 20px 0;
    }
    .footer {
      margin-top: 50px;
      font-size: 16px;
      color: #888;
    }
    /* Trái tim rơi */
    .heart {
      position: fixed;
      top: -50px;
      width: 30px;
      height: 30px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/3461/3461839.png');
      background-size: cover;
      animation: fall linear infinite;
      z-index: 0;
    }
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    /* Bo góc */
    .container {
      border-radius: 30px;
    }
    .section {
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thiệp Mời</h1>
    <div class="names">
      Nguyễn Hữu Đông <br/>
      &<br/>
      Trần Quỳnh Như
    </div>

    <div class="invite">
      Trân trọng kính mời <br/>
      ANH/CHỊ/CÔ/CHÚ/CẬU/MƠ...
    </div>

    <div class="section date">
      Ngày dương lịch: <strong>16/06/2025</strong> <br/>
      Ngày âm lịch: <strong>21/05/âm lịch</strong>
    </div>

    <div class="section time-detail">
      - <strong>Lễ cưới:</strong> 9h00 sáng<br/>
      - <strong>Đãi tiệc:</strong> 11h00 đến 13h00
    </div>

    <div class="countdown" id="countdown">
      Đếm ngược đến giờ làm lễ...
    </div>

    <div class="footer">
      Thiệp cưới online bởi Hữu Đông
    </div>
  </div>

  <!-- JavaScript countdown -->
  <script>
    const countdownEl = document.getElementById("countdown");
    const targetDate = new Date("2025-06-16T09:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownEl.innerHTML = "Buổi lễ đã bắt đầu!";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownEl.innerHTML = `Còn ${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

  <!-- Trái tim rơi -->
  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => {
        heart.remove();
      }, 8000);
    }
    setInterval(createHeart, 300);
  </script>
</body>
</html>
