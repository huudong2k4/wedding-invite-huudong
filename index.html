<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: url('https://i.imgur.com/ncNjOT3.jpg'); /* Marble background */
      background-size: cover;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .card {
      max-width: 600px;
      margin: auto;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      margin-top: 40px;
    }
    h1, h2, h3 {
      text-align: center;
      font-family: 'Times New Roman', cursive;
    }
    .names {
      font-size: 28px;
      font-weight: bold;
    }
    .date {
      text-align: center;
      font-size: 18px;
      margin-top: 20px;
    }
    .time-table {
      text-align: center;
      margin-top: 20px;
    }
    .countdown {
      text-align: center;
      font-size: 24px;
      margin-top: 20px;
      color: #d9534f;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Save the Date</h2>
    <div class="names">Nguyễn Hữu Đông & Trần Quỳnh Như</div>
    <div class="date">Hôn lễ ngày 16/06/2025 (Nhằm ngày 21/06/2025)</div>
    <div class="date">Địa điểm: ....................................................</div><div class="time-table">
  <p><strong>Thời gian làm lễ:</strong> 9:00 - 10:00</p>
  <p><strong>Thời gian đãi tiệc:</strong> 11:00 - 13:00</p>
</div>

<div class="countdown" id="countdown"></div>

  </div>  <script>
    const weddingDate = new Date('2025-06-16T09:00:00');
    const countdownElement = document.getElementById('countdown');

    function updateCountdown() {
      const now = new Date();
      const diff = weddingDate - now;

      if (diff <= 0) {
        countdownElement.textContent = "Hôn lễ đã diễn ra!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownElement.textContent = `Còn ${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây đến ngày cưới!`;
    }

    setInterval(updateCountdown, 1000);
  </script></body>
</html>
