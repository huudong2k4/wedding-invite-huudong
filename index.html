<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Playfair Display', serif;
      background: url('https://i.imgur.com/3ZQ3Z6T.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #4a3c31;
    }
    .card {
      max-width: 650px;
      margin: 60px auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: #a6794f;
      margin-bottom: 10px;
    }
    .names {
      font-size: 30px;
      font-weight: bold;
      margin: 10px 0;
    }
    .info {
      font-size: 18px;
      margin: 8px 0;
    }
    .highlight {
      color: #a6794f;
      font-weight: bold;
    }
    .countdown {
      font-size: 20px;
      margin-top: 20px;
      color: #c03e3e;
      font-weight: bold;
    }
    .divider {
      height: 1px;
      background: #ccc;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Save the Date</div>
    <div class="names">Nguyễn Hữu Đông & Trần Quỳnh Như</div><div class="divider"></div>

<div class="info">Hôn lễ sẽ được cử hành vào ngày <span class="highlight">16/06/2025</span></div>
<div class="info">(Nhằm ngày <span class="highlight">21/06/2025</span> âm lịch)</div>
<div class="info">Địa điểm: <span class="highlight">....................................................</span></div>

<div class="divider"></div>

<div class="info">Thời gian làm lễ: <span class="highlight">09:00 - 10:00</span></div>
<div class="info">Thời gian đãi tiệc: <span class="highlight">11:00 - 13:00</span></div>

<div class="divider"></div>

<div class="countdown" id="countdown"></div>

  </div>  <script>
    const weddingDate = new Date('2025-06-16T09:00:00');
    const countdownElement = document.getElementById('countdown');

    function updateCountdown() {
      const now = new Date();
      const diff = weddingDate - now;

      if (diff <= 0) {
        countdownElement.textContent = "Hôn lễ đã diễn ra!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownElement.textContent = `Còn ${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây đến ngày cưới!`;
    }

    setInterval(updateCountdown, 1000);
  </script></body>
</html>
